syntax = "proto3";

package notification.v1;

enum Channel {
  CHANNEL_UNSPECIFIED = 0;
  CHANNEL_EMAIL = 1;
  CHANNEL_WEBHOOK = 2;
  CHANNEL_IN_APP = 3;
}

enum DeliveryStatus {
  STATUS_UNSPECIFIED = 0;
  STATUS_QUEUED = 1;
  STATUS_DELIVERED = 2;
  STATUS_FAILED = 3;
  STATUS_RETRYING = 4;
}

message Payload {
  string title = 1;
  string body = 2;
  map<string, string> metadata = 3;
}

message DeliveryOptions {
  uint32 max_retries = 1;
  uint32 retry_delay_ms = 2;
  uint32 timeout_ms = 3;
}

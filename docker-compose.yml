services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: notifications
      POSTGRES_USER: notif_user
      POSTGRES_PASSWORD: notif_pass
    ports: ["5432:5432"]
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U notif_user -d notifications"]
      interval: 5s
      timeout: 5s
      retries: 5

  redpanda:
    image: redpandadata/redpanda:latest
    command:
      - redpanda
      - start
      - --smp=1
      - --memory=512M
      - --kafka-addr=PLAINTEXT://0.0.0.0:9092
      - --advertise-kafka-addr=PLAINTEXT://redpanda:9092
    ports: ["9092:9092", "9644:9644"]

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  mailhog:
    image: mailhog/mailhog
    ports: ["1025:1025", "8025:8025"]

  delivery-service:
    build:
      context: .
      dockerfile: services/delivery-service/Dockerfile
    environment:
      GRPC_PORT: 50051
      DATABASE_URL: postgresql://notif_user:notif_pass@postgres/notifications
      KAFKA_BROKERS: redpanda:9092
      SMTP_HOST: mailhog
      SMTP_PORT: 1025
      RUST_LOG: info
    ports: ["50051:50051", "9091:9090"]
    depends_on:
      postgres:
        condition: service_healthy
      redpanda:
        condition: service_started
      mailhog:
        condition: service_started

  notification-worker:
    build:
      context: .
      dockerfile: services/notification-worker/Dockerfile
    environment:
      DATABASE_URL: postgresql://notif_user:notif_pass@postgres/notifications
      KAFKA_BROKERS: redpanda:9092
      KAFKA_GROUP_ID: notification-worker
      DELIVERY_SERVICE_URL: http://delivery-service:50051
      RUST_LOG: info
    ports: ["9093:9090"]
    depends_on:
      postgres:
        condition: service_healthy
      redpanda:
        condition: service_started
      delivery-service:
        condition: service_started

  api-gateway:
    build:
      context: .
      dockerfile: services/api-gateway/Dockerfile
    environment:
      PORT: 8080
      METRICS_PORT: 9090
      DATABASE_URL: postgresql://notif_user:notif_pass@postgres/notifications
      KAFKA_BROKERS: redpanda:9092
      REDIS_URL: redis://redis:6379
      JWT_SECRET: local-dev-secret
      RUST_LOG: info
    ports: ["8080:8080", "9090:9090"]
    depends_on:
      postgres:
        condition: service_healthy
      redpanda:
        condition: service_started
      redis:
        condition: service_started

volumes:
  postgres_data:

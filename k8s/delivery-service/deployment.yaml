apiVersion: apps/v1
kind: Deployment
metadata:
  name: delivery-service
  namespace: notification-service
  labels: { app: delivery-service }
spec:
  replicas: 2
  selector:
    matchLabels: { app: delivery-service }
  template:
    metadata:
      labels: { app: delivery-service }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
    spec:
      containers:
        - name: delivery-service
          image: sharifme04/delivery-service:latest
          ports:
            - { containerPort: 50051, name: grpc }
            - { containerPort: 9090,  name: metrics }
          env:
            - name: GRPC_PORT
              value: "50051"
            - name: SMTP_HOST
              valueFrom:
                secretKeyRef: { name: notification-secrets, key: smtp-host }
            - name: SMTP_PORT
              valueFrom:
                secretKeyRef: { name: notification-secrets, key: smtp-port }
          resources:
            requests: { cpu: "100m", memory: "128Mi" }
            limits:   { cpu: "500m", memory: "512Mi" }

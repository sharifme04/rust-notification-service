apiVersion: apps/v1
kind: Deployment
metadata:
  name: dashboard
  namespace: notification-service
  labels: { app: dashboard }
spec:
  replicas: 1
  selector:
    matchLabels: { app: dashboard }
  template:
    metadata:
      labels: { app: dashboard }
    spec:
      containers:
        - name: dashboard
          image: sharifme04/dashboard:latest
          ports:
            - { containerPort: 80, name: http }
          resources:
            requests: { cpu: "50m", memory: "64Mi" }
            limits:   { cpu: "200m", memory: "256Mi" }
